function fightView(){active='fight';document.querySelector('.tabs').style.display='none';document.querySelector('.brand span').textContent=' / COMBAT';view.innerHTML='<div class="section-head"><h2>Gallowsfen · The Sunken Road</h2><span class="pill">Wave 08</span></div><div class="attack-row"><div><strong>AUTO ATTACK</strong><small>Mace Swing</small><div class="attack-meter"><i></i></div></div><span class="attack-time">1.8s</span></div><div class="fight-card" style="background-image:linear-gradient(#10141b40,#080b10a8),url(/lab/combat/character-assets/gallowfen.png)"><span class="fight-title">LV 21 · BLIGHTED / BEAST</span><img class="monster" src="/lab/combat/character-assets/gravejaw.png"><span class="enemy-name">GRAVEJAW STALKER · 3,942 / 8,200</span><div class="health-bar"><i></i></div><span class="dps" title="Live damage per second">2.86M</span></div><div class="section-head"><h2>Combat summary</h2><span class="subtle">damage per second</span></div><div class="stats"><div class="stat"><label>Damage dealt</label><strong>18.4M</strong></div><div class="stat"><label>Hits</label><strong>126</strong></div><div class="stat"><label>Slain</label><strong>08</strong></div></div>';let dps=2860000;clearInterval(window.dpsTimer);window.dpsTimer=setInterval(()=>{dps+=Math.floor(Math.random()*26000);let n=dps>=1e12?(dps/1e12).toFixed(2)+'T':dps>=1e9?(dps/1e9).toFixed(2)+'B':dps>=1e6?(dps/1e6).toFixed(2)+'M':dps>=1e3?(dps/1e3).toFixed(2)+'K':String(dps);let e=document.querySelector('.dps');if(e)e.textContent=n},1000)}
function render(){document.querySelector('.tabs').style.display='grid';document.querySelector('.brand span').textContent=' / CHARACTER';if(active==='fight'){fightView();return}({equipment:equipment,inventory:inventory,crafting:crafting,materials:materials})[active]()}
function switchTab(n){active=n;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));document.querySelector('#detail').classList.remove('open');render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-screen]').forEach(x=>x.classList.toggle('selected',x===b));if(b.dataset.screen==='fight'){if(window.parent!==window)window.parent.postMessage({type:'godscar:close-character'},location.origin);else fightView()}else{active='equipment';render()}});
function detail(x,e){selected={x:x,e:e};document.querySelector('#detailName').textContent=x.name;document.querySelector('#detailMeta').textContent=(x.rarity||'')+' · '+(x.slot||x.type||'Equipment');document.querySelector('#detailCopy').textContent=x.detail||'';document.querySelector('#equipAction').textContent=e?'Unequip':'Equip';document.querySelector('#detail').classList.add('open')}
document.querySelector('#closeDetail').onclick=()=>document.querySelector('#detail').classList.remove('open');document.querySelector('#equipAction').onclick=()=>{if(selected)document.querySelector('#equipAction').textContent=selected.e?'Unequipped ✓':'Equipped ✓'};document.querySelector('#compareAction').onclick=()=>document.querySelector('#detailCopy').textContent+=' · Compare view can use real item stats.';
const modal=document.querySelector('#styleModal');document.querySelector('#tune').onclick=()=>modal.classList.add('show');document.querySelector('#closeTune').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
function range(id,prop,unit,format){let x=document.querySelector('#'+id);x.oninput=()=>{document.documentElement.style.setProperty(prop,x.value+unit);x.nextElementSibling.value=format?format(x.value):x.value+unit}}
range('scale','--ui-scale','',v=>Math.round(v*100)+'%');range('slot','--slot-size','px');range('round','--ui-radius','px');document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--accent',b.dataset.color));render();
</script></body></html>
