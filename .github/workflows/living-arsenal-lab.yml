name: Godscar current screen and prototype checks

on:
  push:
    branches: [work/living-arsenal-lab, work/**, preview/browser]
  pull_request:
    branches: [preview/browser]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate current screen and archived prototype modules
        run: |
          node --check lab/arsenal/engine.mjs
          node --check lab/arsenal/catalog.mjs
          node --check lab/arsenal/ui.mjs
          node --check lab/arsenal/art.mjs
          node lab/arsenal/art-tests.mjs
          node lab/arsenal/tests.mjs
          node --check lab/combat/main.mjs
          node --check lab/combat/character.mjs
      - name: Keep preserved simulation bundle buildable
        run: |
          npm test
          npm run build
      - name: Serve the selected combat and Character direction
        shell: bash
        run: |
          set -euo pipefail
          PORT=3106 node preview/server.mjs &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3106/health > /tmp/arsenal-health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3106/ > /tmp/godscar-current.html
          grep -q 'id="characterMenu"' /tmp/godscar-current.html
          grep -q 'id="arenaDps"' /tmp/godscar-current.html
          grep -q 'COMBAT PREVIEW' /tmp/godscar-current.html
          ! grep -q 'Interface Skeleton' /tmp/godscar-current.html
          for retired_route in /lab /lab/combat/ /lab/arsenal/; do
            curl -fsSI "http://127.0.0.1:3106$retired_route" | grep -qi 'location: /'
          done
          curl -fsS http://127.0.0.1:3106/lab/combat/character.html > /tmp/godscar-character.html
          grep -q '12 / 12 slots' /tmp/godscar-character.html
          grep -q 'Loadout · Oathkeeper' /tmp/godscar-character.html
          grep -q 'data-screen="fight"' /tmp/godscar-character.html
          curl -fsS http://127.0.0.1:3106/lab/combat/main.mjs | grep -q 'formatCompactNumber'
          curl -fsSI http://127.0.0.1:3106/lab/combat/character.html | grep -qi 'x-frame-options: SAMEORIGIN'
          curl -fsS http://127.0.0.1:3106/lab/combat/character-assets/pauldrons.png -o /tmp/godscar-character-pauldrons.png
          file /tmp/godscar-character-pauldrons.png | grep -q PNG
