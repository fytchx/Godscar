name: Living Arsenal systems lab checks

on:
  push:
    branches: [work/living-arsenal-lab, work/**, preview/browser]
  pull_request:
    branches: [preview/browser]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate Living Arsenal engine and interface preview
        run: |
          node --check lab/arsenal/engine.mjs
          node --check lab/arsenal/catalog.mjs
          node --check lab/arsenal/ui.mjs
          node --check lab/arsenal/art.mjs
          node lab/arsenal/art-tests.mjs
          node lab/arsenal/tests.mjs
          node --check lab/combat/main.mjs
          node --check lab/combat/character.mjs
      - name: Verify original browser gameplay still works
        run: |
          npm test
          npm run build
      - name: Serve original game and opt-in lab, then smoke check
        shell: bash
        run: |
          set -euo pipefail
          PORT=3106 node preview/server.mjs &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3106/health > /tmp/arsenal-health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3106/ > /tmp/godscar-original.html
          grep -q GODSCAR /tmp/godscar-original.html
          curl -fsS http://127.0.0.1:3106/lab/arsenal/ > /tmp/godscar-lab.html
          grep -q "Living Arsenal Prototype" /tmp/godscar-lab.html
          curl -fsS http://127.0.0.1:3106/lab/arsenal/ui.mjs > /tmp/godscar-lab-ui.mjs
          grep -q '"Fight","Character","Skills","Forge","Materials"' /tmp/godscar-lab-ui.mjs
          grep -q 'from "./engine.mjs"' /tmp/godscar-lab-ui.mjs
          grep -q 'localStorage' /tmp/godscar-lab-ui.mjs
          grep -q 'data-hunt' /tmp/godscar-lab-ui.mjs
          grep -q 'LIVE DPS' /tmp/godscar-lab-ui.mjs
          curl -fsS http://127.0.0.1:3106/lab/arsenal/art.mjs | grep -q 'combatIllustration'
          curl -fsS http://127.0.0.1:3106/lab/arsenal/styles.css | grep -q -- "--bg"
          curl -fsS http://127.0.0.1:3106/lab/combat/ > /tmp/godscar-combat.html
          grep -q 'id="characterMenu"' /tmp/godscar-combat.html
          grep -q 'id="arenaDps"' /tmp/godscar-combat.html
          curl -fsS http://127.0.0.1:3106/lab/combat/character.html > /tmp/godscar-character.html
          grep -q '12 / 12 slots' /tmp/godscar-character.html
          grep -q 'Loadout · Oathkeeper' /tmp/godscar-character.html
          grep -q 'data-screen="fight"' /tmp/godscar-character.html
          curl -fsS http://127.0.0.1:3106/lab/combat/main.mjs | grep -q 'formatCompactNumber'
          curl -fsSI http://127.0.0.1:3106/lab/combat/character.html | grep -qi 'x-frame-options: SAMEORIGIN'
          curl -fsS http://127.0.0.1:3106/lab/combat/character-assets/pauldrons.png -o /tmp/godscar-character-pauldrons.png
          file /tmp/godscar-character-pauldrons.png | grep -q PNG
