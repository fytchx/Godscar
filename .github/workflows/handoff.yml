name: Godscar handoff continuity

on:
  push:
    branches: [preview/browser]
  pull_request:
    branches: [preview/browser]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check each pushed commit for durable handoff documentation
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/check-handoff.mjs
