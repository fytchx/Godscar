name: Web tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && python3 build.py && git diff --exit-code dist/index.html
      - run: cd web && node test/actions.js && node test/evo.js && node test/migrate.js && node test/balance.js warrior 1
