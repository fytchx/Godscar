name: Godscar current-site and preserved simulation checks

on:
  push:
    branches: [preview/browser]
    paths:
      - 'web/**'
      - 'preview/**'
      - 'package.json'
      - '.github/workflows/browser-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preserved simulation logic
        run: npm test
      - name: Build preserved simulation reference bundle
        run: npm run build
      - name: Serve and smoke-test the selected combat and Character screen
        shell: bash
        run: |
          set -euo pipefail
          PORT=3105 node preview/server.mjs &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3105/health > /tmp/godscar-health.json && break
            sleep 1
          done
          node -e "const h=require('/tmp/godscar-health.json');if(h.status!=='ok'||h.serverAuthoritative)process.exit(1)"
          curl -fsS http://127.0.0.1:3105/ > /tmp/godscar-browser.html
          node -e "const fs=require('fs');const s=fs.readFileSync('/tmp/godscar-browser.html','utf8');for(const k of ['id=\"characterMenu\"','id=\"arenaDps\"','COMBAT PREVIEW','ART REVIEW MOCKUP']){if(!s.includes(k))throw Error('Missing selected screen element: '+k)};if(s.includes('GODSCAR SIM CORE'))throw Error('Retired original page is still public')"
          curl -fsSI http://127.0.0.1:3105/lab/arsenal/ | grep -qi 'location: /'
