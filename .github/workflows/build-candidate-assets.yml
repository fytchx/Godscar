name: Build candidate sprites from source art
on:
  push:
    branches: [dev]
    paths:
      - "art/source_sheets/**"
      - "art/asset_manifest.json"
      - "tools/build_art_assets.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Require at least one source sheet
        run: |
          if ! find art/source_sheets -maxdepth 1 -type f -name '*.png' -print -quit | grep -q .; then
            echo "No original source sheets committed yet; upload original art sheets first."
            exit 1
          fi
      - name: Extract review candidates
        run: python tools/build_art_assets.py
      - name: Commit generated review sprites to dev
        if: github.ref == 'refs/heads/dev'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/art_review
          if git diff --cached --quiet; then
            echo 'No changes in candidate sprites.'
          else
            git commit -m 'art: update generated review sprite candidates [skip ci]'
            git push origin HEAD:dev
          fi
      - name: Publish QA archive
        uses: actions/upload-artifact@v4
        with:
          name: godscar-review-sprites
          path: assets/art_review/
          retention-days: 30
