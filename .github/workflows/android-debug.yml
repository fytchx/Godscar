name: Godscar Android Debug APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap scripting dependency
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3

      - name: Validate Godot project files
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/arena.tscn
          test -f scripts/arena.gd
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Configure Godot export templates
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HOME" != "/root" ]]; then
            mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
            mkdir -p "$HOME/.config/godot"
            if [[ -d /root/.config/godot ]]; then cp -a /root/.config/godot/. "$HOME/.config/godot/"; fi
          fi
          godot --version

      - name: Version APK for this build
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = s.replace('version/code=3', 'version/code=' + str(1000 + int(os.environ["GITHUB_RUN_NUMBER"])))
          s = s.replace('version/name="0.3"', 'version/name="0.3-ci.' + os.environ["GITHUB_RUN_NUMBER"] + '"')
          p.write_text(s)
          project = Path("project.godot")
          config = project.read_text()
          setting = "textures/vram_compression/import_etc2_astc=true"
          if setting not in config:
              config = config.replace("[rendering]", "[rendering]\n" + setting, 1)
              project.write_text(config)
          PY

      - name: Import resources and check GDScript
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import --quit

      - name: Export debug APK
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" "$PWD/build/android/Godscar-debug.apk"
          test -s build/android/Godscar-debug.apk

      - name: Upload installable APK artifact
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Godscar-${{ github.ref_name }}-Android-${{ github.run_number }}
          path: build/android/Godscar-debug.apk
          if-no-files-found: error
          retention-days: 30

